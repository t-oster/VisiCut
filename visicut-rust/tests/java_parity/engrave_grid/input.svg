<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="31.75mm" height="31.75mm" viewBox="0 0 625 625">
  <!-- Background a quarter pixel off the pixel grid: Helper.toRect then
       truncates far from whole pixels, and it covers every raster pixel. -->
  <rect x="19.25" y="19.25" width="421.5" height="261.5" fill="#ffffff"/>
  <rect x="20" y="20" width="100" height="50" fill="#000000"/>
  <rect x="130" y="20" width="100" height="100" fill="#404040"/>
  <rect x="240" y="20" width="100" height="100" fill="#808080"/>
  <rect x="350" y="20" width="90" height="100" fill="#c0c0c0"/>
  <rect x="20" y="80" width="100" height="40" fill="#202020"/>
  <image x="20" y="130" width="160" height="80" xlink:href="data:image/png;base64,"/>
  <rect x="200" y="130" width="240" height="150" fill="#606060"/>
  <rect x="260" y="160" width="120" height="90" fill="#e0e0e0"/>
</svg>
