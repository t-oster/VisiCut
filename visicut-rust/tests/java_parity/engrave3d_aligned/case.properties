# 3D engraving: power per pixel from the grey value; pixel-aligned geometry.
# Only the header is compared. VisiCutRust deliberately differs in the lines
# (PROTOCOL.md): Java trims 8-bit lines at grey 0 (black) instead of power 0
# and shifts 8-bit data by bits, which moves power values between pixels.
compare=header
name=eng3d
svg=input.svg
operation=engrave3d
power=60
speed=50
x_mm=127
y_mm=254
width_mm=31.75
height_mm=31.75
